name: MapLibre checks
on:
  push:
    branches: [maplibre-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bun-lock
          path: bun.lock
